services:
  api:
    image: ${GHCR_NAMESPACE}/leadflow-backend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      PORT: "8000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL não definida}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY não definida}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    networks:
      - app-internal
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  webhook-worker:
    image: ${GHCR_NAMESPACE}/leadflow-backend:${IMAGE_TAG}
    restart: unless-stopped
    command: ["python", "-m", "app.webhooks.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL não definida}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY não definida}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    networks:
      - app-internal
    depends_on:
      api:
        condition: service_healthy

  web:
    image: ${GHCR_NAMESPACE}/leadflow-frontend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      BACKEND_API_URL: http://api:8000
    networks:
      - app-internal
      - proxy
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.leadflow.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.leadflow.entrypoints=websecure"
      - "traefik.http.routers.leadflow.tls.certresolver=le"
      - "traefik.http.services.leadflow.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
    name: proxy

  app-internal:
    internal: true

